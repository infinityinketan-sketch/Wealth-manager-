name: build-apk

# Builds an installable debug APK in the cloud. No Android Studio needed.
# Run it: GitHub repo -> Actions tab -> build-apk -> Run workflow (or just push a change).
# Download it: open the finished run, scroll to "Artifacts", download wealth-manager-debug-apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      # Show compiler and Gradle errors on the run page instead of only "exit code 1".
      - name: Report build errors
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|^ERROR' build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Same shrinking as the Play build (unsigned here), plus the "no internet" promise check.
      - name: Check release build
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee -a build.log
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions $(ls app/build/outputs/apk/release/*.apk | head -1) | tee perms.txt
          while IFS= read -r line; do echo "::notice::$line"; done < perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::INTERNET permission found"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
