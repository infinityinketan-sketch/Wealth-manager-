name: build-release

# Builds the signed Play Store bundle (.aab) plus a signed APK for checking on a phone.
# Run it: Actions tab -> build-release -> Run workflow. (Also runs for tags like v1.0.0.)
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   WM_KEYSTORE_BASE64, WM_KEYSTORE_PASSWORD, WM_KEY_ALIAS, WM_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the upload key
        env:
          KEYSTORE_B64: ${{ secrets.WM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The WM_KEYSTORE_BASE64 secret is missing. See RELEASE.md, step 'Signing key'."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "WM_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --console=plain

      - name: Build signed bundle and APK
        env:
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
          WM_KEY_ALIAS: ${{ secrets.WM_KEY_ALIAS }}
          WM_KEY_PASSWORD: ${{ secrets.WM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] && grep -E -A4 '^e: |What went wrong|^ERROR' build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      # The app promises "no internet": fail the release if the INTERNET permission ever sneaks in.
      - name: Check permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          while IFS= read -r line; do echo "::notice::$line"; done < perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission found in the release build"
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -3 | while IFS= read -r line; do echo "::notice::$line"; done

      - uses: actions/upload-artifact@v4
        with:
          name: wealth-manager-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
